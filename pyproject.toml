[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insta-roller"
version = "0.1.0"
description = "Automatic reframing and editing of Insta360 X5 footage"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ffmpeg = ["imageio-ffmpeg>=0.5"]

[project.scripts]
insta-roller = "core.cli:main"

[tool.setuptools]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
