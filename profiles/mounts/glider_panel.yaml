# Mount "szybowiec, tablica przyrządów": camera on the panel in front of the pilot.
# Angles are in the aircraft frame: yaw 0 = nose, +90 = right wing, 180 = pilot.
# fov is the diagonal field of view of the output frame.
name: glider_panel

# Rotation that turns each source into the aircraft frame.
calibration:
  dual_fisheye: {lens_fov: 200, yaw: 0, pitch: -40, roll: 0}   # raw LRV proxy
  equirect: {yaw: 0, pitch: 0, roll: 0}                      # Insta360 Studio export
  # Media SDK stitch, no stabilisation: the picture stays tied to the glider.
  sdk: {yaw: 0, pitch: -40, roll: 0, stabilize: none}

# horizon: aircraft = the picture banks with the glider (cabin in view);
#          locked = the horizon stays level (clean outside views).
# exposure_ev: brightness correction for the preset (cabin vs outside).
presets:
  front:       {yaw: 0,    pitch: 0,  fov: 120}
  front_level: {yaw: 0,    pitch: 0,  fov: 120, horizon: locked}
  pilot:       {yaw: 180,  pitch: 0,  fov: 90,  exposure_ev: 0.25}
  pilot_wide:  {yaw: 180,  pitch: 5,  fov: 140, exposure_ev: 0.15}
  back_left:  {yaw: -120, pitch: 5,  fov: 125}
  back_right: {yaw: 120,  pitch: 5,  fov: 125}
  # Along the wing and down at the ground, pilot out of frame.
  wing_left:  {yaw: -100, pitch: 8,  fov: 115}
  wing_right: {yaw: 100,  pitch: 8,  fov: 115}
  # Moves inside one framing (fov_end = a slow zoom while the view is held).
  front_in:     {yaw: 0,   pitch: 0,  fov: 120, fov_end: 95,  horizon: locked}   # push in on the horizon
  front_out:    {yaw: 0,   pitch: 0,  fov: 95,  fov_end: 125, horizon: locked}   # pull back: the view opens up
  pilot_close:  {yaw: 180, pitch: 0,  fov: 100, fov_end: 78,  exposure_ev: 0.25} # push in on the pilot
  # Down at the ground beside the fuselage; followed by wing_* the view rises to the horizon.
  ground_left:  {yaw: -95, pitch: -40, fov: 105}
  ground_right: {yaw: 95,  pitch: -40, fov: 105}
  # Unusual views for the "Zaskocz mnie" reel.
  # planet: straight down, everything wrapped into a ball that slowly turns;
  # followed by planet_front the ball unrolls into the view ahead.
  planet:       {yaw: 0,   pitch: -90, fov: 300, projection: planet,  safe_zone: false, pan_dps: 12}
  planet_front: {yaw: 0,   pitch: 0,   fov: 150, projection: planet,  safe_zone: false}
  # bubble: round ultra-wide view, pilot with both wings / the whole canopy ahead.
  bubble:       {yaw: 180, pitch: 10,  fov: 220, projection: fisheye, safe_zone: false, exposure_ev: 0.15}
  bubble_front: {yaw: 0,   pitch: 0,   fov: 220, projection: fisheye, safe_zone: false}
  # around: a slow look round with the horizon held level while the glider banks.
  around:       {yaw: 0,   pitch: 5,   fov: 125, horizon: locked, pan_dps: 30}
  # barrel: the picture rolls once all the way over.
  barrel:       {yaw: 0,   pitch: 0,   fov: 125, roll_turns: 1}
  # Views only a 360 camera gives.
  # hold_*: the picture keeps its compass direction while the glider turns: in a thermal
  # the landscape stands still and the wing, the nose and the pilot pass through the frame.
  hold_left:    {yaw: -95, pitch: 2,  fov: 112, horizon: locked, world: true, safe_zone: false}
  hold_right:   {yaw: 95,  pitch: 2,  fov: 112, horizon: locked, world: true, safe_zone: false}
  # home: the picture stays on the airfield the flight began from, wherever the glider points.
  home:         {yaw: 0,   pitch: 0,  fov: 95,  horizon: locked, target: home, safe_zone: false}
  # Straight up past the wing: the last step of a sweep from the ground to the sky.
  sky_left:     {yaw: -100, pitch: 55, fov: 115, safe_zone: false}
  sky_right:    {yaw: 100,  pitch: 55, fov: 115, safe_zone: false}
  # Halves of a split frame (two views at once, one above the other).
  front_half:   {yaw: 0,   pitch: -3, fov: 105, horizon: locked, safe_zone: false}
  pilot_half:   {yaw: 180, pitch: 2, fov: 100, exposure_ev: 0.2, safe_zone: false}
  # Aimed at what the model saw (yaw and pitch come with the scene), with a slow push in.
  sight:        {yaw: 0, pitch: 0, fov: 88, fov_end: 72, horizon: locked, track: sight, safe_zone: false}
