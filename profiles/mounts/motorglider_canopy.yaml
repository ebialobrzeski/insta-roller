# Mount "motoszybowiec, owiewka": camera on the canopy, roughly in the middle,
# seats side by side. Angles are first guesses: check them with
# `insta-roller preview <folder> --profile flight_motor` on a real recording.
# yaw 0 = nose, +90 = right wing, 180 = back towards the crew.
name: motorglider_canopy

calibration:
  # The camera sits on a suction cup and gets moved, also in flight: where it is level and
  # where the nose is are worked out for every scene from its sensors (auto_nose).
  dual_fisheye: {lens_fov: 200, auto_level: true, auto_nose: true}
  equirect: {yaw: 0, pitch: 0, roll: 0}

# The second person: `pilot_wide: crew` shows both seats; point it at
# left_seat (or right_seat) to keep the other person out of the reels.
aliases:
  pilot: left_seat
  pilot_wide: crew

presets:
  front:       {yaw: 0,    pitch: 5,   fov: 115}
  front_level: {yaw: 0,    pitch: 5,   fov: 115, horizon: locked}
  instruments: {yaw: 0,    pitch: -45, fov: 90,  exposure_ev: 0.2}
  left_seat:   {yaw: 155,  pitch: -15, fov: 95,  exposure_ev: 0.2}
  right_seat:  {yaw: -155, pitch: -15, fov: 95,  exposure_ev: 0.2}
  crew:        {yaw: 180,  pitch: -10, fov: 140, exposure_ev: 0.15}
  back_left:   {yaw: -120, pitch: 5,   fov: 125}
  back_right:  {yaw: 120,  pitch: 5,   fov: 125}
  wing_left:   {yaw: -100, pitch: 8,   fov: 115}
  wing_right:  {yaw: 100,  pitch: 8,   fov: 115}
  # Moves inside one framing and unusual views, as in glider_panel (first guesses).
  front_in:     {yaw: 0,   pitch: 5,   fov: 115, fov_end: 92,  horizon: locked}
  front_out:    {yaw: 0,   pitch: 5,   fov: 92,  fov_end: 122, horizon: locked}
  pilot_close:  {yaw: 155, pitch: -15, fov: 100, fov_end: 80,  exposure_ev: 0.2}
  ground_left:  {yaw: -95, pitch: -40, fov: 105}
  ground_right: {yaw: 95,  pitch: -40, fov: 105}
  planet:       {yaw: 0,   pitch: -90, fov: 300, projection: planet,  safe_zone: false, pan_dps: 12}
  planet_front: {yaw: 0,   pitch: 5,   fov: 150, projection: planet,  safe_zone: false}
  bubble:       {yaw: 180, pitch: -10, fov: 220, projection: fisheye, safe_zone: false, exposure_ev: 0.15}
  bubble_front: {yaw: 0,   pitch: 0,   fov: 220, projection: fisheye, safe_zone: false}
  around:       {yaw: 0,   pitch: 5,   fov: 125, horizon: locked, pan_dps: 30}
  barrel:       {yaw: 0,   pitch: 5,   fov: 125, roll_turns: 1}
