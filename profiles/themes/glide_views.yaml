# Przelot i widoki: straight flight between thermals.
name: glide_views
title: Przelot i widoki
include: [glide]
max_per_type: {glide: 4}
# Every shot is framed differently: the shots take these in turn.
variants:
  glide:
    - [front_out]                   # the view opens up
    - [wing_left, front_level]
    - [pilot_close, front_level]    # push in on the pilot, then out of the canopy
    - [back_right, wing_right]
target_length_s: 25
min_material_s: 12
