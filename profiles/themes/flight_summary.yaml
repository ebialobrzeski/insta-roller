# Skrot lotu: the whole flight in one reel. Borrows scenes from the other reels.
# Circuit and landing are used only when the `landing` theme is switched on.
name: flight_summary
title: Skrót lotu
borrows: true
include: [takeoff, tow, release, climb, engine_off, thermal, glide, sight, circuit, landing]
max_per_type: {tow: 1, climb: 1, thermal: 3, glide: 2, sight: 2, circuit: 1}
variants:
  thermal:
    - [hold_inner]
    - [ground_inner, wing_inner]
    - [pilot_wide, wing_inner]
    - [front_in]
  glide:
    - [pilot_close, front]
    - [front_out]
target_length_s: 45
# Without a recorded landing the reel ends on the pilot.
ending: {preset: pilot_wide, duration_s: 4}
