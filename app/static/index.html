<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insta-roller</title>
<script>
  // The remembered theme, before the first paint.
  try { const t = JSON.parse(localStorage.getItem("theme")); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (error) {}
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Menu">
    <a class="brand" href="#przeglad" id="brand"><span>insta-roller</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <a class="notice" id="notice" href="#nowy"></a>
      <a class="now" id="now" href="#filmy" title="Co aplikacja robi teraz"><i class="dot"></i><span id="now-text">Bezczynna</span></a>
      <div id="theme"></div>
      <button class="collapse" id="collapse" type="button"></button>
    </div>
  </aside>
  <button class="scrim" id="scrim" type="button" aria-label="Zamknij menu"></button>
  <div class="main">
    <header class="top">
      <button class="btn menu" id="menu" type="button" aria-label="Menu"></button>
      <div class="context" id="context"></div>
      <a class="btn" href="#filmy" id="top-films"></a>
      <a class="btn primary" href="#nowy" id="top-new"></a>
    </header>
    <main class="frame" id="view"></main>
  </div>
</div>
<div id="toast" role="status" hidden></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
